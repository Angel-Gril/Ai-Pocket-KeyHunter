[workspace]
resolver = "2"
members = [
  "crates/aipocket-core",
  "crates/aipocket-db",
  "crates/aipocket-clients",
  "crates/aipocket-discovery",
  "crates/aipocket-prober",
  "crates/aipocket-services",
  "crates/aipocket-api",
  "crates/aipocket",
]
default-members = ["crates/aipocket"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
authors = ["aipocket"]

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
csv = "1"
dotenvy = "0.15"
futures = "0.3"
http-body-util = "0.1"
jsonwebtoken = "9"
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "stream", "cookies", "hickory-dns"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "json", "chrono", "migrate"] }
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs", "process", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
parking_lot = "0.12"
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "trace", "fs", "compression-gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.metadata.llvm-cov]
ignore-filename-regex = "crates/aipocket/src/(main|maintenance)\\.rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
