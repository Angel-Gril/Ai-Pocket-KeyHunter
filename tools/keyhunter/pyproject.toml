[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keyhunter"
version = "0.1.0"
description = "Standalone FOFA to panel login to account export hunter (Sub2API-first)"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "fuyou" },
    { name = "lifefloating" },
]
dependencies = [
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "typer>=0.27.1",
    "rich>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[project.scripts]
keyhunter = "keyhunter.cli:app"

[tool.setuptools.packages.find]
include = ["keyhunter*"]

[tool.setuptools.package-data]
keyhunter = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
ignore = ["B008"]
