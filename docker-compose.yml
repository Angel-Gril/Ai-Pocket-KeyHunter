services:
  backend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aipocket-backend
    volumes:
      - /data/aipocket:/data/aipocket
    env_file:
      - .env
    environment:
      - RESULTS_DIR=/data/aipocket/results
      - DEDUP_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://aipocket:aipocket@postgres:5432/aipocket
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["serve", "--host", "0.0.0.0", "--port", "8000"]

  frontend:
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 256m
    build: ./frontend
    container_name: aipocket-frontend
    ports:
      - "3080:80"
    restart: unless-stopped
    depends_on:
      - backend

  # Optional periodic scanner. Enable with:
  #   docker compose --profile watch up -d backend-watch
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
  backend-watch:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aipocket-watch
    profiles: ["watch"]
    volumes:
      - /data/aipocket:/data/aipocket
    env_file:
      - .env
    environment:
      - RESULTS_DIR=/data/aipocket/results
      - DEDUP_REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://aipocket:aipocket@postgres:5432/aipocket
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["watch"]


  postgres:
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    image: postgres:16-alpine
    container_name: aipocket-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aipocket
      - POSTGRES_PASSWORD=aipocket
      - POSTGRES_DB=aipocket
    volumes:
      - /data/aipocket/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aipocket -d aipocket"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    image: redis:7-alpine
    container_name: aipocket-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - /data/aipocket/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
