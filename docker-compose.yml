services:
  aipocket:
    build: .
    container_name: aipocket
    volumes:
      - /data/aipocket:/data/aipocket
    environment:
      - RESULTS_DIR=/data/aipocket/results
      - DEDUP_REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    command: ["watch"]

  redis:
    image: redis:7-alpine
    container_name: aipocket-redis
    restart: unless-stopped
    # Persist the dedup cache across container restarts so a redeploy doesn't
    # wipe cross-run dedup state and force a full re-scan.
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - /data/aipocket/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
